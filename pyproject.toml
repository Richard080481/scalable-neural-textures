[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scalable-neural-textures"
version = "0.1.0"
description = "Reproducible scaling study of distributed neural texture training"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.24",
  "Pillow>=10",
  "PyYAML>=6",
  "matplotlib>=3.8",
  "torch>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
neural-texture-train = "neural_texture.train:main"
neural-texture-evaluate = "neural_texture.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

